name: publish

# Builds the images and pushes them to Docker Hub: the test images to
# montanamendy/bngsim-linux, and bngsim installed, to run it, to montanamendy/bngsim
# (tagged by bngsim release, the newest on PyPI, and latest; amd64 and arm64).
# Every image carries an SBOM and the build's provenance (attestations, which
# Docker Hub shows), and is scanned for known vulnerabilities before it is
# pushed (the run's summary has the report).
# The test images:
# when the Dockerfiles change on main, weekly from a freshly pulled base (the
# distributions' security updates), and on demand. Each image is checked
# inside (tests/test_container.py) before it is pushed. Tags:
#   debian, latest   amd64 + arm64        ubuntu, bionetgen   amd64
#   <tag>-amd64 / <tag>-arm64             one architecture
#   <tag>-<YYYYMMDD>-<commit>             fixed, to pin a run to the very image
on:
  push:
    branches: [main]
    paths: ["images/**", ".github/workflows/publish.yml"]
  schedule:
    - cron: "41 5 * * 1"  # weekly, before ci.yml's run: everything, from fresh bases
    - cron: "17 6 * * *"  # daily: a new bngsim release on PyPI, if not yet published
  workflow_dispatch:
    inputs:
      bngsim_version:
        description: "a bngsim release to build (default: the newest on PyPI); an older one leaves latest alone"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  REPO: montanamendy/bngsim-linux
  HUB_USER: montanamendy

jobs:
  build:
    name: build, check and push (${{ matrix.arch }})
    # Forks have no token and are not the publisher. The daily check, and a run
    # for one bngsim release, leave the test images alone.
    if: >-
      github.repository == 'Montana/bngsim-docker'
      && github.event.schedule != '17 6 * * *'
      && (github.event_name != 'workflow_dispatch' || inputs.bngsim_version == '')
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            kinds: "bionetgen ubuntu"  # bionetgen builds the Debian image first
          - arch: arm64
            runner: ubuntu-24.04-arm
            kinds: "debian"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==8.3.5
      - name: turn on Docker's containerd image store (attestations need it)
        run: |
          sudo python3 -c "import json, pathlib; p = pathlib.Path('/etc/docker/daemon.json'); \
          d = json.loads(p.read_text()) if p.exists() and p.read_text().strip() else {}; \
          d.setdefault('features', {})['containerd-snapshotter'] = True; p.write_text(json.dumps(d))"
          sudo systemctl restart docker
          docker info -f '{{json .DriverStatus}}' | grep -q containerd
      - name: build
        env:
          FRESH: ${{ github.event_name == 'schedule' }}
        run: |
          extra=(--attest)
          if [ "$FRESH" = true ]; then extra+=(--fresh); fi
          for kind in ${{ matrix.kinds }}; do
            python bngsim_docker.py build --arch ${{ matrix.arch }} --kind "$kind" "${extra[@]}"
          done
      - name: check inside each image
        run: |
          if [ "${{ matrix.arch }}" = amd64 ]; then
            images="bngsim-linux-amd64:latest bngsim-linux-ubuntu:latest bngsim-linux-bionetgen:latest"
          else
            images="bngsim-linux-arm64:latest"
          fi
          for image in $images; do
            echo "== $image"
            BNGSIM_DOCKER_IMAGE="$image" BNGSIM_DOCKER_ARCH=${{ matrix.arch }} python -m pytest -q -rs tests/test_container.py
          done
      - name: scan for known vulnerabilities (a report, in the run's summary)
        continue-on-error: true
        run: |
          if [ "${{ matrix.arch }}" = amd64 ]; then
            images="bngsim-linux-amd64:latest bngsim-linux-ubuntu:latest bngsim-linux-bionetgen:latest"
          else
            images="bngsim-linux-arm64:latest"
          fi
          for image in $images; do
            bash scripts/scan-image.sh "$image" "linux/${{ matrix.arch }}" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: docker/login-action@v3
        with:
          username: ${{ env.HUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: push
        run: |
          push() {  # local image, tag
            docker tag "$1" "${REPO}:${2}-${{ matrix.arch }}"
            docker push -q "${REPO}:${2}-${{ matrix.arch }}"
          }
          if [ "${{ matrix.arch }}" = amd64 ]; then
            push bngsim-linux-amd64:latest debian
            push bngsim-linux-ubuntu:latest ubuntu
            push bngsim-linux-bionetgen:latest bionetgen
          else
            push bngsim-linux-arm64:latest debian
          fi

  tags:
    name: multi-architecture and fixed tags
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ env.HUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: stamp
        run: echo "stamp=$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: tag
        env:
          STAMP: ${{ steps.stamp.outputs.stamp }}
        run: |
          # test: the same image as debian and latest, named for what it is for (bngsim-test).
          docker buildx imagetools create -t "${REPO}:debian" -t "${REPO}:latest" -t "${REPO}:test" \
            -t "${REPO}:debian-${STAMP}" "${REPO}:debian-amd64" "${REPO}:debian-arm64"
          for kind in ubuntu bionetgen; do
            docker buildx imagetools create -t "${REPO}:${kind}" -t "${REPO}:${kind}-${STAMP}" "${REPO}:${kind}-amd64"
          done
      - name: every tag names this repository as its source, and carries its SBOM and provenance
        env:
          STAMP: ${{ steps.stamp.outputs.stamp }}
          # One image, or one per platform (a multi-architecture tag): each must name its source.
          CHECK: |
            import json, sys
            d = json.load(sys.stdin)
            images = [d] if "config" in d else list(d.values())
            bad = [i.get("architecture") for i in images
                   if (i.get("config", {}).get("Labels") or {}).get("org.opencontainers.image.source")
                   != "https://github.com/Montana/bngsim-docker"]
            print(sys.argv[1], f"has no source label on {bad}" if bad else f"ok: {len(images)} image(s) name their source")
            sys.exit(1 if bad else 0)
          # An SBOM and provenance for each architecture of each tag.
          ATTEST: |
            import json, sys
            ref, want = sys.argv[1], int(sys.argv[2])
            sbom, prov = (json.load(open(f, encoding="utf-8")) for f in sys.argv[3:5])
            per = lambda d: [d] if any(k in d for k in ("SPDX", "SLSA")) else list(d.values())
            n_sbom = sum(bool(x.get("SPDX")) for x in per(sbom or {}))
            n_prov = sum(bool(x.get("SLSA")) for x in per(prov or {}))
            print(ref, f"SBOM {n_sbom}/{want}, provenance {n_prov}/{want}")
            sys.exit(0 if n_sbom == want and n_prov == want else 1)
        run: |
          for tag in latest test debian ubuntu bionetgen "debian-${STAMP}" "ubuntu-${STAMP}" "bionetgen-${STAMP}"; do
            docker buildx imagetools inspect "${REPO}:${tag}" --format '{{json .Image}}' | python3 -c "$CHECK" "${REPO}:${tag}"
            case "$tag" in latest|test|debian*) n=2 ;; *) n=1 ;; esac
            # Each to its own file: the output has no newline at its end, and an SBOM is megabytes.
            docker buildx imagetools inspect "${REPO}:${tag}" --format '{{json .SBOM}}' > sbom.json
            docker buildx imagetools inspect "${REPO}:${tag}" --format '{{json .Provenance}}' > provenance.json
            python3 -c "$ATTEST" "${REPO}:${tag}" "$n" sbom.json provenance.json
          done

  # ── montanamendy/bngsim: bngsim installed, to run it ──────────────────────
  release:
    name: the bngsim release to publish
    if: github.repository == 'Montana/bngsim-docker'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pypi.outputs.version }}
      series: ${{ steps.pypi.outputs.series }}
      newest: ${{ steps.pypi.outputs.newest }}
      newest_in_series: ${{ steps.pypi.outputs.newest_in_series }}
      build: ${{ steps.pypi.outputs.build }}
    steps:
      # Which release, and which of its tags move: latest and jupyter follow the
      # newest release, and the series tag (0.17) the newest in its series, so a
      # release built again by name never moves either back. The daily check
      # builds only a release Docker Hub does not have yet.
      - id: pypi
        env:
          ASKED: ${{ inputs.bngsim_version }}
          DAILY_RUN: ${{ github.event.schedule == '17 6 * * *' }}
          PICK: |
            import json, os, re, sys, urllib.request
            pypi = json.load(urllib.request.urlopen("https://pypi.org/pypi/bngsim/json", timeout=60))
            newest = pypi["info"]["version"]
            version = os.environ.get("ASKED") or newest
            final = [v for v in pypi["releases"] if re.fullmatch(r"\d+\.\d+\.\d+", v) and pypi["releases"][v]]
            if version not in pypi["releases"] or not pypi["releases"][version]:
                sys.exit(f"bngsim {version} is not on PyPI")
            series = ".".join(version.split(".")[:2])
            key = lambda v: tuple(int(x) for x in v.split("."))
            in_series = [v for v in final if v.startswith(series + ".")]
            newest_in_series = bool(in_series) and version == max(in_series, key=key)
            try:
                urllib.request.urlopen(f"https://hub.docker.com/v2/repositories/montanamendy/bngsim/tags/{version}", timeout=60)
                published = True
            except Exception:
                published = False
            build = not (os.environ.get("DAILY_RUN") == "true" and published)
            out = dict(version=version, series=series, newest=str(version == newest).lower(),
                       newest_in_series=str(newest_in_series).lower(), build=str(build).lower())
            print(f"bngsim {version}: newest on PyPI {newest}, on Docker Hub already {published}; {out}")
            with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                f.writelines(f"{k}={v}\n" for k, v in out.items())
        run: python3 -c "$PICK"

  bngsim-build:
    name: bngsim and jupyter images, build, check and push (${{ matrix.arch }})
    needs: release
    if: needs.release.outputs.build == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            image: bngsim-run:latest
            jupyter: bngsim-jupyter:latest
          - arch: arm64
            runner: ubuntu-24.04-arm
            image: bngsim-run-arm64:latest
            jupyter: bngsim-jupyter-arm64:latest
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==8.3.5
      - name: turn on Docker's containerd image store (attestations need it)
        run: |
          sudo python3 -c "import json, pathlib; p = pathlib.Path('/etc/docker/daemon.json'); \
          d = json.loads(p.read_text()) if p.exists() and p.read_text().strip() else {}; \
          d.setdefault('features', {})['containerd-snapshotter'] = True; p.write_text(json.dumps(d))"
          sudo systemctl restart docker
          docker info -f '{{json .DriverStatus}}' | grep -q containerd
      - name: build
        env:
          FRESH: ${{ github.event_name == 'schedule' }}
        run: |
          extra=()
          if [ "$FRESH" = true ]; then extra+=(--fresh); fi
          python bngsim_docker.py build --kind bngsim --arch ${{ matrix.arch }} --bngsim-version "$VERSION" --attest "${extra[@]}"
          python bngsim_docker.py build --kind bngsim-jupyter --arch ${{ matrix.arch }} --bngsim-version "$VERSION" --attest
      - name: check inside against exact answers (BNGL, SSA, SBML, Antimony, the tour notebook)
        env:
          BNGSIM_RUN_IMAGE: ${{ matrix.image }}
          BNGSIM_JUPYTER_IMAGE: ${{ matrix.jupyter }}
          BNGSIM_DOCKER_ARCH: ${{ matrix.arch }}
        run: python -m pytest -q -rs tests/test_bngsim_image.py
      - name: scan for known vulnerabilities (a report, in the run's summary)
        continue-on-error: true
        run: |
          for image in "${{ matrix.image }}" "${{ matrix.jupyter }}"; do
            bash scripts/scan-image.sh "$image" "linux/${{ matrix.arch }}" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: docker/login-action@v3
        with:
          username: ${{ env.HUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: push
        run: |
          docker tag "${{ matrix.image }}" "montanamendy/bngsim:${VERSION}-${{ matrix.arch }}"
          docker push -q "montanamendy/bngsim:${VERSION}-${{ matrix.arch }}"
          docker tag "${{ matrix.jupyter }}" "montanamendy/bngsim:${VERSION}-jupyter-${{ matrix.arch }}"
          docker push -q "montanamendy/bngsim:${VERSION}-jupyter-${{ matrix.arch }}"

  bngsim-tags:
    name: bngsim and jupyter images, multi-architecture tags
    needs: [release, bngsim-build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release.outputs.version }}
      SERIES: ${{ needs.release.outputs.series }}
      NEWEST: ${{ needs.release.outputs.newest }}
      NEWEST_IN_SERIES: ${{ needs.release.outputs.newest_in_series }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ env.HUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: tag
        run: |
          # The release's own tags always; the series tag (0.17) for the newest in
          # its series; latest and jupyter for the newest release.
          run=("montanamendy/bngsim:${VERSION}" "montanamendy/bngsim-linux:run-${VERSION}")
          jup=("montanamendy/bngsim:${VERSION}-jupyter" "montanamendy/bngsim-linux:jupyter-${VERSION}")
          if [ "$NEWEST_IN_SERIES" = true ]; then
            run+=("montanamendy/bngsim:${SERIES}"); jup+=("montanamendy/bngsim:${SERIES}-jupyter")
          fi
          if [ "$NEWEST" = true ]; then
            # The same images under bngsim-linux too, so its page serves everyone: run
            # (bngsim ready) and jupyter (for teaching), beside the test images.
            run+=(montanamendy/bngsim:latest montanamendy/bngsim-linux:run)
            jup+=(montanamendy/bngsim:jupyter montanamendy/bngsim-linux:jupyter)
          fi
          printf '%s\n' "${run[@]}" "${jup[@]}" > tags.txt
          docker buildx imagetools create "${run[@]/#/-t}" \
            "montanamendy/bngsim:${VERSION}-amd64" "montanamendy/bngsim:${VERSION}-arm64"
          docker buildx imagetools create "${jup[@]/#/-t}" \
            "montanamendy/bngsim:${VERSION}-jupyter-amd64" "montanamendy/bngsim:${VERSION}-jupyter-arm64"
      - name: both architectures name this repository as their source, and carry their SBOM and provenance
        env:
          CHECK: |
            import json, sys
            d = json.load(sys.stdin)
            images = [d] if "config" in d else list(d.values())
            bad = [i.get("architecture") for i in images
                   if (i.get("config", {}).get("Labels") or {}).get("org.opencontainers.image.source")
                   != "https://github.com/Montana/bngsim-docker"]
            print(sys.argv[1], f"has no source label on {bad}" if bad else f"ok: {len(images)} image(s) name their source")
            sys.exit(1 if bad or len(images) != 2 else 0)
          # An SBOM and provenance for each architecture of each tag.
          ATTEST: |
            import json, sys
            ref, want = sys.argv[1], int(sys.argv[2])
            sbom, prov = (json.load(open(f, encoding="utf-8")) for f in sys.argv[3:5])
            per = lambda d: [d] if any(k in d for k in ("SPDX", "SLSA")) else list(d.values())
            n_sbom = sum(bool(x.get("SPDX")) for x in per(sbom or {}))
            n_prov = sum(bool(x.get("SLSA")) for x in per(prov or {}))
            print(ref, f"SBOM {n_sbom}/{want}, provenance {n_prov}/{want}")
            sys.exit(0 if n_sbom == want and n_prov == want else 1)
        run: |
          while read -r ref; do
            docker buildx imagetools inspect "$ref" --format '{{json .Image}}' | python3 -c "$CHECK" "$ref"
            # Each to its own file: the output has no newline at its end, and an SBOM is megabytes.
            docker buildx imagetools inspect "$ref" --format '{{json .SBOM}}' > sbom.json
            docker buildx imagetools inspect "$ref" --format '{{json .Provenance}}' > provenance.json
            python3 -c "$ATTEST" "$ref" 2 sbom.json provenance.json
          done < tags.txt

  binder:
    # The browser link (mybinder.org) points at the binder branch, not main: Binder
    # rebuilds whenever the branch it serves moves, so a push to main would make
    # the next launch wait minutes. The branch's binder/Dockerfile names the
    # jupyter image by digest, and this job moves the branch only when that
    # digest changes: launches stay fast, and Binder serves the very image that
    # passed its checks.
    name: point the browser link at the new jupyter image
    needs: [release, bngsim-tags]
    if: needs.release.outputs.newest == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - name: move the binder branch if the jupyter image changed
        run: |
          digest=$(docker buildx imagetools inspect montanamendy/bngsim:jupyter --format '{{json .Manifest}}' \
            | python3 -c "import json, sys; print(json.load(sys.stdin)['digest'])")
          case "$digest" in sha256:*) ;; *) echo "no digest for montanamendy/bngsim:jupyter: $digest"; exit 1 ;; esac
          pinned="FROM montanamendy/bngsim:jupyter@${digest}"
          if git fetch -q origin binder 2>/dev/null \
              && git show FETCH_HEAD:binder/Dockerfile | grep -qxF "$pinned"; then
            echo "the binder branch already serves ${digest}"
            exit 0
          fi
          git checkout -q -B binder "origin/${GITHUB_REF_NAME}"
          PINNED="$pinned" python3 -c "import os, re, pathlib; p = pathlib.Path('binder/Dockerfile'); p.write_text(re.sub(r'^FROM montanamendy/bngsim:jupyter\\S*$', os.environ['PINNED'], p.read_text(), flags=re.M))"
          grep -qxF "$pinned" binder/Dockerfile
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -am "binder: serve montanamendy/bngsim:jupyter@${digest}"
          git push -q --force origin binder
          echo "the binder branch now serves ${digest}"

