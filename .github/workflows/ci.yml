name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"  # weekly: bngsim main moves, and the smoke run follows it

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install pytest==8.3.5 ruff==0.14.0
      - run: python -m ruff check .
      - run: python -m pytest -q tests
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: hadolint
        run: |
          for f in images/Dockerfile images/Dockerfile.ubuntu images/Dockerfile.bionetgen images/Dockerfile.bngsim; do
            docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --ignore DL3008 --ignore DL3013 - < "$f"
          done

  images:
    name: build the images, check inside them
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==8.3.5
      - run: python bngsim_docker.py build --kind bionetgen
      - run: python bngsim_docker.py build --kind ubuntu
      - name: check the base image
        env:
          BNGSIM_DOCKER_IMAGE: bngsim-linux-amd64:latest
        run: python -m pytest -q -rs tests/test_container.py
      - name: check the Ubuntu image
        env:
          BNGSIM_DOCKER_IMAGE: bngsim-linux-ubuntu:latest
        run: python -m pytest -q -rs tests/test_container.py
      - name: check the BioNetGen image
        env:
          BNGSIM_DOCKER_IMAGE: bngsim-linux-bionetgen:latest
          BNGSIM_DOCKER_ARCH: amd64
        run: python -m pytest -q -rs tests/test_container.py
      - run: python bngsim_docker.py build --kind bngsim
      - run: python bngsim_docker.py build --kind bngsim-jupyter
      - name: check the bngsim and jupyter images against exact answers (BNGL, SSA, SBML, Antimony, the notebook)
        env:
          BNGSIM_RUN_IMAGE: bngsim-run:latest
          BNGSIM_JUPYTER_IMAGE: bngsim-jupyter:latest
          BNGSIM_DOCKER_ARCH: amd64
        run: python -m pytest -q -rs tests/test_bngsim_image.py
      - name: save the base image for the smoke run
        run: docker save bngsim-linux-amd64:latest | gzip > base.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: base-image
          path: base.tar.gz
          retention-days: 1

  smoke:
    name: bngsim main, built and tested in the image
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lanl/bngsim
          path: bngsim
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: base-image
      - run: gunzip -c base.tar.gz | docker load
      - name: a few files through the CLI
        run: |
          python bngsim_docker.py test --tree bngsim --out smoke \
            --tests python/tests/test_version_consistency.py python/tests/test_method_normalization.py
      - name: one command, nothing else installed (bngsim-test fetches main from GitHub)
        run: |
          docker run --rm bngsim-linux-amd64:latest bngsim-test --ref main \
            python/tests/test_version_consistency.py python/tests/test_method_normalization.py | tee bngsim-test.log
          grep -q "bngsim-test: testing main at" bngsim-test.log
          grep -Eq "[0-9]+ passed" bngsim-test.log && ! grep -Eq "[0-9]+ failed" bngsim-test.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: smoke/
          retention-days: 7

  full-suite:
    # Weekly, and on demand: the whole of bngsim's suite on main, in the Debian
    # image on a native x86-64 runner, failing on a failure known-failures.txt
    # does not list and on one it lists that passed. So the list stays true.
    name: bngsim main, the whole suite (weekly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: images
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lanl/bngsim
          path: bngsim
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: base-image
      - run: gunzip -c base.tar.gz | docker load
      - name: the whole suite through the CLI
        run: |
          python bngsim_docker.py test --tree bngsim --out full --workers 4 --build-jobs 2 \
            --memory 14g --timeout 7200 --fail-on-stale
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-suite-logs
          path: full/
          retention-days: 14

  arm64:
    name: the arm64 image
    runs-on: ubuntu-24.04-arm
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==8.3.5
      - run: python bngsim_docker.py build --arch arm64
      - env:
          BNGSIM_DOCKER_IMAGE: bngsim-linux-arm64:latest
        run: python -m pytest -q -rs tests/test_container.py
      - name: build the bngsim image (bngsim from its sdist, as PyPI has no aarch64 wheel)
        run: python bngsim_docker.py build --kind bngsim --arch arm64
      - run: python bngsim_docker.py build --kind bngsim-jupyter --arch arm64
      - env:
          BNGSIM_RUN_IMAGE: bngsim-run-arm64:latest
          BNGSIM_JUPYTER_IMAGE: bngsim-jupyter-arm64:latest
          BNGSIM_DOCKER_ARCH: arm64
        run: python -m pytest -q -rs tests/test_bngsim_image.py
