# bngsim's Linux test images, and a run of a bngsim tree's tests in one.
#
# Build (the BioNetGen image is built on the amd64 one, so build that first):
#   docker compose build linux-amd64 && docker compose build linux-bionetgen
#   docker compose build linux-ubuntu linux-arm64
#
# Run a tree's tests (the tree is mounted read-only and copied inside):
#   BNGSIM_TREE=~/work/bngsim docker compose run --rm suite
#   BNGSIM_TREE=~/work/bngsim docker compose run --rm suite python/tests/test_x.py
#   BNGSIM_TREE=~/work/bngsim docker compose run --rm suite-ubuntu      # as bngsim's CI
#   BNGSIM_TREE=~/work/bngsim docker compose run --rm suite-bionetgen
#   BNGSIM_TREE=~/work/bngsim docker compose run --rm shell
#
# Logs go to ./out (build.log, pytest.log). WORKERS sets pytest-xdist's
# workers, BUILD_JOBS the compiles at once. Each image compiles through ccache
# into a volume of its own, the CLI's (bngsim-ccache-<kind>-<arch>), so the two
# share a cache and a second run of a tree recompiles only what changed.

x-tree: &tree ${BNGSIM_TREE:-/set-BNGSIM_TREE-to-a-bngsim-checkout}:/tree:ro
x-out: &out ./out:/out
x-scripts: &scripts ./scripts:/scripts:ro

x-run: &run
  mem_limit: 10g
  working_dir: /src
  environment:
    WORKERS: ${WORKERS:-3}
    BUILD_JOBS: ${BUILD_JOBS:-2}
  entrypoint: ["bash", "/scripts/container-test.sh"]

services:
  linux-amd64:
    image: bngsim-linux-amd64:latest
    platform: linux/amd64
    build:
      context: images
      dockerfile: Dockerfile
      additional_contexts:
        scripts: ./scripts
    profiles: ["build"]

  linux-arm64:
    image: bngsim-linux-arm64:latest
    platform: linux/arm64
    build:
      context: images
      dockerfile: Dockerfile
      additional_contexts:
        scripts: ./scripts
    profiles: ["build"]

  linux-ubuntu:
    image: bngsim-linux-ubuntu:latest
    platform: linux/amd64
    build:
      context: images
      dockerfile: Dockerfile.ubuntu
      additional_contexts:
        scripts: ./scripts
    profiles: ["build"]

  linux-bionetgen:
    image: bngsim-linux-bionetgen:latest
    platform: linux/amd64
    build:
      context: images
      dockerfile: Dockerfile.bionetgen
      args:
        BASE: bngsim-linux-amd64:latest
    profiles: ["build"]

  suite:
    <<: *run
    image: bngsim-linux-amd64:latest
    platform: linux/amd64
    volumes: [*tree, *out, *scripts, "ccache-debian-amd64:/ccache"]

  suite-arm64:
    <<: *run
    image: bngsim-linux-arm64:latest
    platform: linux/arm64
    volumes: [*tree, *out, *scripts, "ccache-debian-arm64:/ccache"]

  suite-ubuntu:
    <<: *run
    image: bngsim-linux-ubuntu:latest
    platform: linux/amd64
    volumes: [*tree, *out, *scripts, "ccache-ubuntu-amd64:/ccache"]

  suite-bionetgen:
    <<: *run
    image: bngsim-linux-bionetgen:latest
    platform: linux/amd64
    volumes: [*tree, *out, *scripts, "ccache-bionetgen-amd64:/ccache"]

  shell:
    <<: *run
    image: bngsim-linux-amd64:latest
    platform: linux/amd64
    volumes: [*tree, *out, *scripts]
    entrypoint:
      - bash
      - -c
      - >-
        mkdir -p /src && tar -C /tree --exclude=./.venv --exclude=./build --exclude=./.git
        -cf - . | tar -C /src -xf - && cd /src && exec bash
    stdin_open: true
    tty: true

# The CLI's volume names, so a run through either fills the same cache.
volumes:
  ccache-debian-amd64:
    name: bngsim-ccache-debian-amd64
  ccache-debian-arm64:
    name: bngsim-ccache-debian-arm64
  ccache-ubuntu-amd64:
    name: bngsim-ccache-ubuntu-amd64
  ccache-bionetgen-amd64:
    name: bngsim-ccache-bionetgen-amd64
